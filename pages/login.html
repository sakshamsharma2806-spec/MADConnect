<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAD Connect | Login</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="login-container">
      <div class="left-panel">
        <h1>MAD Connect</h1>
        <p class="title">Chapter Management System</p>
        <div class="quote">
          <h2 id="userName">Welcome Back</h2>
          <p>
            Every attendance tells a story. Every volunteer makes a difference.
          </p>
        </div>
      </div>

      <div class="right-panel">
        <div class="login-card">
          <h2>Login</h2>
          <p>Sign in to continue</p>

          <div class="role-selector">
            <button type="button" class="role-btn active" data-role="cho">
              <span class="role-icon">&#128101;</span>
              <span class="role-label">Chapter Organizer</span>
            </button>
            <button type="button" class="role-btn" data-role="admin">
              <span class="role-icon">&#128737;</span>
              <span class="role-label">Core Member / Admin</span>
            </button>
          </div>

          <form id="loginForm">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" />

            <label>Password</label>
            <div class="password-box">
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
              />
              <span id="togglePassword">&#128065;</span>
            </div>

            <div class="show-password">
              <input type="checkbox" id="showPassword" />
              <label for="showPassword"> Show Password </label>
            </div>

            <div class="options">
              <label>
                <input type="checkbox" />
                Remember Me
              </label>
              <a href="#"> Need Help? </a>
            </div>

            <button type="submit" id="loginBtn">Login</button>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="../js/login.js"></script>
  </body>
</html>
